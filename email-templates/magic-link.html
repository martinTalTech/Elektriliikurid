<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f0f0;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:#0a0a0a;padding:30px 40px;text-align:center;">
              <a href="https://elektriliikur.ee" style="text-decoration:none;display:inline-block;">
                <span style="font-size:26px;font-weight:900;letter-spacing:-0.5px;color:#73bb3c;">elektri</span><span style="font-size:26px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;">liikur&#46;ee</span>
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:48px 48px 40px;">
              <h1 style="margin:0 0 12px;font-size:26px;font-weight:800;color:#111111;letter-spacing:-0.5px;">
                Sinu sisselogimise link
              </h1>
              <p style="margin:0 0 36px;font-size:16px;line-height:1.6;color:#555555;">
                Vajuta nupule, et end sisse logida. Link kehtib <strong style="color:#111111;">1 tund</strong>.
              </p>

              <!-- Button -->
              <table cellpadding="0" cellspacing="0" style="margin:0 0 36px;">
                <tr>
                  <td style="background:#73bb3c;border-radius:10px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 40px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;letter-spacing:0.2px;">
                      Logi sisse →
                    </a>
                  </td>
                </tr>
              </table>

              <div style="height:1px;background:#eeeeee;margin:0 0 24px;"></div>

              <p style="margin:0;font-size:13px;line-height:1.7;color:#999999;">
                Kui sa ei palunud sisselogimise linki, ignoreeri seda kirja.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f8f8f8;padding:20px 48px;border-top:1px solid #eeeeee;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:12px;color:#aaaaaa;">
                    © 2026 Elektriliikur&#46;ee
                  </td>
                  <td align="right" style="font-size:12px;">
                    <a href="mailto:info@elektriliikur.ee" style="color:#73bb3c;text-decoration:none;">info@elektriliikur&#46;ee</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
