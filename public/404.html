<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>elektriliikurid.ee</title>
  <script type="text/javascript">
    // GitHub Pages 404 → SPA redirect for HashRouter
    // Converts /kuulutused/123 → /#/kuulutused/123
    var l = window.location;
    var path = l.pathname.replace(/\/$/, '');
    var hash = '#' + path + (l.search || '');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + hash
    );
  </script>
</head>
<body></body>
</html>
