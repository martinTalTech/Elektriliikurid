<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Tuleme varsti tagasi | elektriliikur.ee</title>
  <meta name="description" content="elektriliikur.ee on hetkel hoolduses. Tuleme varsti tagasi!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(115, 187, 60, 0.15) 0%, rgba(115, 187, 60, 0) 70%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    .container {
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 48px;
    }
    .brand .green { color: #73bb3c; }
    .brand .white { color: #fff; }
    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.2;
      letter-spacing: -1px;
    }
    .accent { color: #73bb3c; }
    p {
      font-size: 18px;
      color: #a0a0a0;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: #73bb3c;
      border-radius: 3px;
      margin: 40px auto;
    }
    .contact {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #707070;
      font-size: 14px;
    }
    .contact a {
      color: #73bb3c;
      text-decoration: none;
      font-weight: 600;
    }
    .contact a:hover {
      text-decoration: underline;
    }
    .dots {
      display: inline-flex;
      gap: 6px;
      margin-left: 4px;
    }
    .dots span {
      width: 8px;
      height: 8px;
      background: #73bb3c;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dots span:nth-child(1) { animation-delay: -0.32s; }
    .dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      p { font-size: 16px; }
      .logo { width: 90px; height: 90px; }
      .brand { font-size: 22px; margin-bottom: 36px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <img src="/logo.png" alt="elektriliikur.ee" class="logo" />
    <div class="brand">
      <span class="green">elektri</span><span class="white">liikur.ee</span>
    </div>

    <h1>Tuleme varsti <span class="accent">tagasi</span></h1>
    <p>Teeme hetkel platvormi veelgi paremaks.</p>
    <p>Ole kannatlik — varsti oleme jälle laivis!
      <span class="dots"><span></span><span></span><span></span></span>
    </p>

    <div class="divider"></div>

    <div class="contact">
      Küsimuste korral kirjuta: <a href="mailto:info@elektriliikur.ee">info@elektriliikur.ee</a>
    </div>
  </div>
</body>
</html>
